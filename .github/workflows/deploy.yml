name: Deploy Google Doc Mirror

on:
  schedule:
    # Runs every 15 minutes, offset off the top-of-hour to dodge GitHub's
    # high-load schedule windows (which can delay or drop :00/:15/:30/:45 ticks)
    - cron: '4,19,34,49 * * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read

env:
  CLOUDFLARE_PAGES_PROJECT: msst-bible

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://msst-bible.pages.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate site
        run: |
          python gdoc_site.py \
            --doc 17fjNvJzj8ZGSer7c7OFe_CNfUKbAxEh_OBv94ZdRG5c \
            --base-url https://msst-bible.pages.dev/ \
            --out _site

      # The doc is edited outside this repo, so a renamed heading, a deleted
      # section or a retitled page can silently break the mirror's internal
      # links and #heading anchors. Fail the deploy here instead of shipping
      # dead links (a doc we can't link is worse than yesterday's snapshot).
      # Also checks the generated markup: duplicate ids and unclosed tags
      # break anchors and can hide whole sections from the browser.
      - name: Check links, anchors + markup
        run: python check_links.py --dir _site

      # wrangler's `pages deploy` errors (code 8000007) if the project
      # doesn't exist yet, so create it first. continue-on-error keeps the
      # step harmless once the project already exists on later runs.
      - name: Create Cloudflare Pages project (if missing)
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create ${{ env.CLOUDFLARE_PAGES_PROJECT }} --production-branch=main

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=${{ env.CLOUDFLARE_PAGES_PROJECT }}